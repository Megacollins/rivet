[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
# Tests call the Rivet engine (real ML-DSA-87 via @noble/post-quantum) through FFI.
ffi = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 64

[rpc_endpoints]
diana = "https://evm-testnet.qore.host"
